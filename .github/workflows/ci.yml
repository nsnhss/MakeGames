name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query: 1.4.309.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-cache: true

      - name: Setup MinGW + Ninja
        run: choco install mingw ninja --no-progress -y

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target launcher editor game engine_tests

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $pkg = "release/MakeGames"
          New-Item -ItemType Directory -Path $pkg -Force | Out-Null
          Copy-Item build/launcher/launcher.exe, build/editor/editor.exe, build/src/game.exe, build/launcher/SDL2.dll $pkg
          Copy-Item assets $pkg/assets -Recurse
          Copy-Item demo_project $pkg/demo_project -Recurse
          Compress-Archive -Path $pkg -DestinationPath release/MakeGames-ci.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MakeGames-windows
          path: release/MakeGames-ci.zip
